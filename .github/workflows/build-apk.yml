name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')
            echo "KEYSTORE_BASE64 length after removing whitespace: ${#CLEAN} (expected 5684)"
            printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "Decoded keystore size: $(stat -c %s "$RUNNER_TEMP/release.jks") bytes (expected 4262)"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing"; exit 1
          else
            echo "::warning::No keystore available (PR from fork?), building with debug signing"
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK
        run: |
          VERSION=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          SHA=$(git rev-parse --short HEAD)
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/ThermalHunter-${VERSION}-${SHA}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThermalHunter-apk
          path: out/*.apk

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
