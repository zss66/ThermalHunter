plugins { id 'com.android.application' }

android {
    namespace 'com.thermalhunter'
    compileSdk 35

    defaultConfig {
        applicationId 'com.thermalhunter'
        minSdk 29
        targetSdk 35
        versionCode 6
        versionName '1.2.2'
    }

    // 固定签名：从环境变量或 keystore.properties 读取；都没有时回退到 debug 签名
    def ksProps = new Properties()
    def ksPropsFile = rootProject.file('keystore.properties')
    if (ksPropsFile.exists()) ksPropsFile.withInputStream { ksProps.load(it) }
    def ksValue = { String envKey, String propKey -> System.getenv(envKey) ?: ksProps.getProperty(propKey) }
    def ksFile = ksValue('SIGNING_STORE_FILE', 'storeFile')

    signingConfigs {
        if (ksFile) {
            release {
                storeFile file(ksFile)
                storePassword ksValue('SIGNING_STORE_PASSWORD', 'storePassword')
                keyAlias ksValue('SIGNING_KEY_ALIAS', 'keyAlias')
                keyPassword ksValue('SIGNING_KEY_PASSWORD', 'keyPassword')
            }
        }
    }

    buildTypes {
        release {
            // 不要混淆：LSPosed 通过类名加载入口，root 端通过 app_process 反射启动
            minifyEnabled false
            signingConfig ksFile ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions { resources.excludes += ['META-INF/**'] }
    lint { checkReleaseBuilds false; abortOnError false }
}

dependencies {
    compileOnly project(':xposed-stub')
    // Shizuku：无 root 时通过无线调试（ADB）以 shell 身份运行采集进程
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
