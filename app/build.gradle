plugins { id 'com.android.application' }

android {
    namespace 'com.thermalhunter'
    compileSdk 35

    defaultConfig {
        applicationId 'com.thermalhunter'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            // 不要混淆：LSPosed 通过类名加载入口，root 端通过 app_process 反射启动
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions { resources.excludes += ['META-INF/**'] }
    lint { checkReleaseBuilds false; abortOnError false }
}

dependencies {
    compileOnly project(':xposed-stub')
}
